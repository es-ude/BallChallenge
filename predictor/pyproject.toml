[project]
name = "predictor"
version = "0.1.0"
description = "Python Backend for the Ball Challanege."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticai-creator",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "seaborn>=0.13.2",
    "torch>=2.7.0",
]

[tool.uv.sources]
elasticai-creator = { git = "https://github.com/es-ude/elastic-ai.creator.git", rev = "main" }

[dependency-groups]
lint = [
    "mypy>=1.15.0",
    "pylsp-mypy>=0.7.0",
    "python-lsp-ruff>=2.2.2",
    "python-lsp-server>=1.12.2",
    "rope>=1.13.0",
    "ruff>=0.11.8",
]
dev = [
    "pytest>=8.3.5",
]
jupyter = [
    "jupyter>=1.1.1",
]

[tool.ruff]
exclude = [
    ".ipynp",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py311"


[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "E",   # pycodestyle
    "D",   # pydocstyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
unfixable = ["B"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false


[tool.ruff.lint.pydocstyle]
convention = "google"
